# Yazi Theme Configuration — Catppuccin Mocha Palette
# Harmonized with Hyprland, Waybar, Rofi, and Kitty dotfiles

[mgr]
cwd = { fg = "#89dceb", bold = true }

# Hovered / selection states
hovered  = { fg = "#cdd6f4", bg = "#313244", bold = true }
selected = { fg = "#f9e2af", bg = "#45475a", bold = true }

# Search / Find highlights
find_keyword  = { fg = "#1e1e2e", bg = "#f9e2af", bold = true }
find_position = { fg = "#89b4fa", bg = "#313244" }

# Visual markers
marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#89dceb", bg = "#89dceb" }
marker_selected = { fg = "#89b4fa", bg = "#89b4fa" }

# Borders
border_style  = { fg = "#45475a" }
active_border = { fg = "#89b4fa" }

# Tab Bar
[tabs]
active   = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
inactive = { fg = "#cdd6f4", bg = "#313244" }

# Status Bar
[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#313244", bg = "#313244" }

mode_normal = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
mode_select = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
mode_unset  = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#313244" }
progress_error  = { fg = "#f38ba8", bg = "#313244" }

permissions_t = { fg = "#89b4fa" }
permissions_r = { fg = "#f9e2af" }
permissions_w = { fg = "#f38ba8" }
permissions_x = { fg = "#a6e3a1" }
permissions_s = { fg = "#6c7086" }

# Git Integration Colors
[git]
modified   = { fg = "#f9e2af" }
added      = { fg = "#a6e3a1" }
untracked  = { fg = "#a6e3a1" }
deleted    = { fg = "#f38ba8" }
staged     = { fg = "#89b4fa" }
updated    = { fg = "#89b4fa" }
conflicted = { fg = "#f38ba8", bold = true }

# Input / Rename Dialog
[input]
border   = { fg = "#89b4fa" }
title    = { fg = "#89b4fa" }
value    = { fg = "#cdd6f4" }
selected = { bg = "#313244" }

# Selection Menu
[select]
border   = { fg = "#89b4fa" }
active   = { fg = "#89b4fa", bold = true }
inactive = { fg = "#cdd6f4" }

# Tasks Dialog
[tasks]
border  = { fg = "#89b4fa" }
title   = { fg = "#89b4fa" }
hovered = { fg = "#cdd6f4", bg = "#313244" }

# Which-Key Popup
[which]
cols            = 3
mask            = { bg = "#1e1e2e" }
cand            = { fg = "#89dceb" }
rest            = { fg = "#6c7086" }
desc            = { fg = "#cdd6f4" }
separator       = "  "
separator_style = { fg = "#45475a" }

# Help Screen
[help]
on      = { fg = "#89b4fa" }
exec    = { fg = "#89dceb" }
desc    = { fg = "#cdd6f4" }
hovered = { fg = "#cdd6f4", bg = "#313244" }
footer  = { fg = "#a6adc8" }

# File Tree Styling
[filetree]
folder = { fg = "#89b4fa", bold = true }

# File Type Rules
[filetype]
rules = [
	{ mime = "image/*", fg = "#89dceb" },
	{ mime = "video/*", fg = "#cba6f7" },
	{ mime = "audio/*", fg = "#cba6f7" },
	{ mime = "application/pdf", fg = "#f38ba8" },
	{ mime = "application/zip", fg = "#fab387" },
	{ mime = "application/x-tar", fg = "#fab387" },
	{ mime = "application/x-bzip2", fg = "#fab387" },
	{ mime = "application/x-7z-compressed", fg = "#fab387" },
	{ mime = "application/x-rar", fg = "#fab387" },
	{ mime = "application/json", fg = "#f9e2af" },
	{ url = "*", is = "exec", fg = "#a6e3a1", bold = true },
	{ url = "*", is = "orphan", fg = "#f38ba8" },
	{ url = "*", is = "dummy", fg = "#f38ba8" },
	{ url = "*", is = "block", fg = "#f9e2af" },
	{ url = "*", is = "char", fg = "#f9e2af" },
	{ url = "*", is = "fifo", fg = "#89dceb" },
	{ url = "*", is = "sock", fg = "#cba6f7" }
]

