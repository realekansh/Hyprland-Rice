# Welcome to your Hypridle configuration!
#
# Hypridle is Hyprland's official idle management daemon. It quietly watches
# for inactivity and takes progressive steps to save power and secure your session.
#
# Full documentation: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
#
# Inactivity Escalation Ladder:
#   1. 120s (2.0 min) -> Notify user screen is idle.
#   2. 180s (3.0 min) -> Dim screen to minimum backlight.
#   3. 300s (5.0 min) -> Lock screen via loginctl / hyprlock.
#   4. 330s (5.5 min) -> Power off screen display via DPMS.
#   5. 1800s (30 min) -> Suspend machine to RAM.

general {
    lock_cmd = pidof hyprlock || hyprlock                                     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                  # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on                               # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 180                               # 3min.
    on-timeout = brightnessctl -s set 50         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
     timeout = 120
     on-timeout = notify-send ":/ Your screen is on Idle" "Hypridle has detected inactivity."
     on-resume = notify-send ":) You're back, $USER" "Welcome back!"
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# listener {
#     timeout = 180                                          # 3min.
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
# }

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                                                                  # 5.5min
    on-timeout = hyprctl dispatch dpms off                                                         # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -r                                       # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
