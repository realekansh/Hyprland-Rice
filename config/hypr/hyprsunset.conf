# 
# Welcome to your Hyprsunset configuration!
#
# Hyprsunset manages blue-light filtering, display color temperature, and
# gamma ramps to ease eye strain during evening and late-night sessions.
#
# Full documentation: https://wiki.hyprland.org/Hypr-Ecosystem/hyprsunset/
#
# You can toggle night mode dynamically anytime using SUPER + SHIFT + N,
# which runs ~/.config/hypr/scripts/hyprsunset-toggle.sh to alternate between
# a soothing 4000K warm temperature and standard identity matrix.

# Maximum display gamma limit (default 100%, max 200%)
max-gamma = 150

# -----------------------------------------------------------------------------
# Daily Night Time Scheduled Profiles (Disabled / Commented Out)
# Uncomment the profiles below if you want automated daily time-based adjustments.
# -----------------------------------------------------------------------------

# Daytime profile (reset to normal color matrix)
# profile {
#   time = 6:00
#   identity = true
#   gamma = 1.0
# }

# Evening profile (mild night warmth)
# profile {
#   time = 18:00
#   temperature = 5500
#   gamma = 0.8
# }

# Late Night profile (stronger night warmth)
# profile {
#   time = 23:00
#   temperature = 4000
#   gamma = 0.7
# }
