# 
# Welcome to your Hyprpaper configuration!
#
# Hyprpaper is a blazing-fast, Wayland-native wallpaper utility that supports
# per-output rendering, image preloading, and dynamic IPC control.
#
# Full documentation: https://wiki.hyprland.org/Hypr-Ecosystem/hyprpaper/
#
# You can shuffle wallpapers anytime using SUPER + SHIFT + W, which runs
# ~/.config/hypr/scripts/wallpaper.sh to pick a random wallpaper and sync
# your Waybar theme seamlessly.


# Default wallpaper block for all monitors
wallpaper {
    monitor =
    path = ~/.config/hypr/hyprpaper/cold-alley.png
    fit_mode = cover
}

ipc = on
splash = false