# Config file for btop v.1.4.7
# Custom Catppuccin Mocha Configuration for Laptop / Hyprland Rice

# Name of a btop++/bpytop/bashtop formatted ".theme" file
color_theme = "catppuccin-mocha"

# Set to false to allow terminal background transparency in Kitty
theme_background = false

# Sets if 24-bit truecolor should be used
truecolor = true

# Set to true to force tty mode regardless if a real tty has been detected or not
force_tty = false

# Preset configurations
disable_presets = "Off"
presets = "cpu:0:default,mem:0:default,net:0:default,proc:0:default"

# Enable vim keys (h,j,k,l,g,G) for navigation
vim_keys = true

# Disable all mouse events
disable_mouse = false

# Rounded corners on boxes
rounded_corners = true

# Synchronized output sequences to reduce flickering
terminal_sync = true

# Default symbols to use for graph creation: "braille", "block" or "tty"
graph_symbol = "block"
graph_symbol_cpu = "block"
graph_symbol_gpu = "block"
graph_symbol_mem = "block"
graph_symbol_net = "block"
graph_symbol_proc = "block"

# Boxes to show: cpu, mem, net, proc
shown_boxes = "cpu mem net proc"

# Update time in milliseconds (~1 second update rate)
update_ms = 1000

# Processes sorting: "cpu lazy" (smooth CPU-sorted list)
proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false

# Process visuals
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = true
proc_info_smaps = false
proc_left = false

# Filter kernel threads for clean process scanning
proc_filter_kernel = true
proc_follow_detailed = true
proc_aggregate = false
keep_dead_proc_usage = false

# CPU Box Configuration
cpu_graph_upper = "total"
cpu_graph_lower = "total"
show_gpu_info = "Auto"
cpu_invert_lower = true
cpu_single_graph = false
cpu_bottom = false

# System & Sensor Information
show_uptime = true
show_cpu_watts = true
check_temp = true
cpu_sensor = "Auto"
show_coretemp = true
cpu_core_map = ""
temp_scale = "celsius"
base_10_sizes = false
show_cpu_freq = true
freq_mode = "average"

# Clock format with Nerd Font icon
clock_format = "󰥔 %X"
background_update = true
custom_cpu_name = ""

# Memory & Storage
disks_filter = ""
mem_graphs = true
mem_below_net = false
zfs_arc_cached = true
show_swap = true
swap_disk = false
show_disks = true
only_physical = true
use_fstab = false
zfs_hide_datasets = false
disk_free_priv = false
show_io_stat = true
io_mode = false
io_graph_combined = false
io_graph_speeds = ""

# Network Box Configuration
swap_upload_download = false
net_download = 100
net_upload = 100
net_auto = true
net_sync = true
net_iface = ""
base_10_bitrate = "Auto"

# Laptop Battery Stats
show_battery = true
selected_battery = "Auto"
show_battery_watts = true

# Logging & Saving
log_level = "WARNING"
save_config_on_exit = true

# GPU Metrics
nvml_measure_pcie_speeds = true
rsmi_measure_pcie_speeds = true
gpu_mirror_graph = true
shown_gpus = "nvidia amd intel apple"
